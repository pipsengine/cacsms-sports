name: Dependency and secret hygiene
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit -r apps/api/requirements.txt
        continue-on-error: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd apps/web && npm install --no-audit --no-fund && npm audit --audit-level=high
        continue-on-error: true
