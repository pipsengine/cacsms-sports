name: cacsms-sports
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports_ai}
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      EXECUTION_MODE: PAPER
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sports_ai}
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      REDIS_URL: redis://redis:6379/0
      SPORTS_ADMIN_TOKEN: ${SPORTS_ADMIN_TOKEN:-}
      SPORTS_SOURCE_FEEDS_JSON: ${SPORTS_SOURCE_FEEDS_JSON:-}
      SPORTS_RESEARCH_QUORUM_JSON: ${SPORTS_RESEARCH_QUORUM_JSON:-}
      SPORTS_DISCOVERY_FEEDS_JSON: ${SPORTS_DISCOVERY_FEEDS_JSON:-}
      SPORTS_OPENLIGADB_ENABLED: ${SPORTS_OPENLIGADB_ENABLED:-0}
      SPORTS_OPENLIGADB_USER_AGENT: ${SPORTS_OPENLIGADB_USER_AGENT:-CACSMS-Sports/1.0}
      SPORTS_FIXTURE_DISCOVERY_ENABLED: ${SPORTS_FIXTURE_DISCOVERY_ENABLED:-0}
      SPORTS_THESPORTSDB_ENABLED: ${SPORTS_THESPORTSDB_ENABLED:-0}
      SPORTS_THESPORTSDB_KEY: ${SPORTS_THESPORTSDB_KEY:-123}
      SPORTS_DEPLOYMENT_ENV: ${SPORTS_DEPLOYMENT_ENV:-development}
      SPORTS_FIXTURE_HORIZON_DAYS: ${SPORTS_FIXTURE_HORIZON_DAYS:-7}
      SPORTS_FIXTURE_JOBS_PER_CYCLE: ${SPORTS_FIXTURE_JOBS_PER_CYCLE:-4}
      SPORTS_SOURCE_CONSENT: ${SPORTS_SOURCE_CONSENT:-}
      SPORTS_BROWSER_ALLOWED_HOSTS: ${SPORTS_BROWSER_ALLOWED_HOSTS:-}
      SPORTS_EVIDENCE_ROOT: /var/lib/cacsms/evidence
      SPORTS_VISION_ENDPOINT: ${SPORTS_VISION_ENDPOINT:-}
      SPORTS_VISION_MODEL: ${SPORTS_VISION_MODEL:-}
      SPORTS_VISION_API_KEY: ${SPORTS_VISION_API_KEY:-}
      SPORTS_VISION_ALLOWED_HOSTS: ${SPORTS_VISION_ALLOWED_HOSTS:-}
    volumes:
      - evidence:/var/lib/cacsms/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
  acquisition-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: celery -A app.modules.acquisition.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      EXECUTION_MODE: PAPER
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sports_ai}
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      REDIS_URL: redis://redis:6379/0
      SPORTS_SOURCE_FEEDS_JSON: ${SPORTS_SOURCE_FEEDS_JSON:-}
      SPORTS_RESEARCH_QUORUM_JSON: ${SPORTS_RESEARCH_QUORUM_JSON:-}
      SPORTS_DISCOVERY_FEEDS_JSON: ${SPORTS_DISCOVERY_FEEDS_JSON:-}
      SPORTS_OPENLIGADB_ENABLED: ${SPORTS_OPENLIGADB_ENABLED:-0}
      SPORTS_OPENLIGADB_USER_AGENT: ${SPORTS_OPENLIGADB_USER_AGENT:-CACSMS-Sports/1.0}
      SPORTS_FIXTURE_DISCOVERY_ENABLED: ${SPORTS_FIXTURE_DISCOVERY_ENABLED:-0}
      SPORTS_THESPORTSDB_ENABLED: ${SPORTS_THESPORTSDB_ENABLED:-0}
      SPORTS_THESPORTSDB_KEY: ${SPORTS_THESPORTSDB_KEY:-123}
      SPORTS_DEPLOYMENT_ENV: ${SPORTS_DEPLOYMENT_ENV:-development}
      SPORTS_FIXTURE_HORIZON_DAYS: ${SPORTS_FIXTURE_HORIZON_DAYS:-7}
      SPORTS_FIXTURE_JOBS_PER_CYCLE: ${SPORTS_FIXTURE_JOBS_PER_CYCLE:-4}
      SPORTS_SOURCE_CONSENT: ${SPORTS_SOURCE_CONSENT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  acquisition-scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: celery -A app.modules.acquisition.tasks.celery_app beat --loglevel=info
    environment:
      EXECUTION_MODE: PAPER
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sports_ai}
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    depends_on: [api]
    ports:
      - "8080:80"
volumes:
  evidence:
  pgdata:
